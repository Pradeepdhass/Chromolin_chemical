<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005959" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008080" />
      <stop offset="100%" stop-color="#005959" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Card Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Top Decorative Header Bar -->
  <path d="M 0 16 A 16 16 0 0 1 16 0 L 584 0 A 16 16 0 0 1 600 16 L 600 70 L 0 70 Z" fill="url(#headerGrad)" />
  
  <!-- Header Pattern Accent -->
  <circle cx="530" cy="-10" r="80" fill="#ffffff" opacity="0.06" />
  <circle cx="570" cy="40" r="50" fill="#ffffff" opacity="0.08" />

  <!-- Brand Name in Header -->
  <text x="30" y="42" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="1">CHROMOLIN CHEMICAL</text>
  
  <!-- Category Badge in Header -->
  <rect x="420" y="22" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" />
  <text x="495" y="39" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="0.5">DESIZING ENZYME</text>

  <!-- Chemical Canister Graphic Icon Container -->
  <g transform="translate(40, 100)">
    <!-- Container Base Card -->
    <rect width="160" height="250" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <rect width="160" height="12" rx="6" fill="#008080" opacity="0.8" />

    <!-- Drum / Bottle Icon -->
    <path d="M 50 40 L 110 40 L 110 60 L 130 75 L 130 200 L 30 200 L 30 75 L 50 60 Z" fill="#f1f5f9" stroke="#005959" stroke-width="3" stroke-linejoin="round" />
    <!-- Cap -->
    <rect x="60" y="25" width="40" height="15" rx="3" fill="#005959" />
    <!-- Liquid Level Fill -->
    <path d="M 33 130 Q 80 120, 127 130 L 127 197 L 33 197 Z" fill="#008080" opacity="0.25" />
    <!-- Chemical Formula / Flask Graphic -->
    <circle cx="80" cy="110" r="22" fill="#ffffff" stroke="#008080" stroke-width="2.5" />
    <path d="M 72 116 L 80 100 L 88 116 Z" fill="#008080" />
    <circle cx="80" cy="115" r="3" fill="#ffffff" />
    <!-- Bottle Label -->
    <rect x="45" y="145" width="70" height="35" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <line x1="53" y1="156" x2="107" y2="156" stroke="#008080" stroke-width="3" stroke-linecap="round" />
    <line x1="53" y1="166" x2="95" y2="166" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Right Details Area -->
  <g transform="translate(225, 95)">
    <!-- Product Prefix Label -->
    <text x="0" y="28" fill="#005959" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="1">CHROMOZYME</text>
    
    <!-- Main Product Code Title -->
    <text x="0" y="78" fill="#008080" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">DSH 20</text>

    <!-- Horizontal Divider Accent -->
    <line x1="0" y1="96" x2="335" y2="96" stroke="#008080" stroke-width="3" stroke-linecap="round" opacity="0.3" />

    <!-- Badges Row -->
    <g transform="translate(0, 112)">
      <!-- Ionic Badge -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#008080" />
      <text x="52" y="17" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Specialty Chemical</text>

      <!-- Form Badge -->
      <rect x="115" y="0" width="105" height="26" rx="6" fill="#f1f5f9" stroke="#008080" stroke-width="1.5" />
      <text x="167" y="17" fill="#005959" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Liquid Form</text>
    </g>

    <!-- Brief Description snippet -->
    <text x="0" y="175" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500">
      High temperature desize for starch and modified starch in Jigger / Pad steam ...
    </text>

    <!-- Bottom Quality & Certification Stamps -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="335" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      
      <!-- Check mark 1 -->
      <circle cx="20" cy="19" r="8" fill="#008080" />
      <path d="M 16 19 L 19 22 L 24 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="34" y="23" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11">GOTS Certified</text>

      <!-- Check mark 2 -->
      <circle cx="130" cy="19" r="8" fill="#008080" />
      <path d="M 126 19 L 129 22 L 134 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="144" y="23" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11">ISO 9001:2008</text>

      <!-- Check mark 3 -->
      <circle cx="240" cy="19" r="8" fill="#008080" />
      <path d="M 236 19 L 239 22 L 244 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="254" y="23" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11">Zero Banned</text>
    </g>
  </g>
</svg>